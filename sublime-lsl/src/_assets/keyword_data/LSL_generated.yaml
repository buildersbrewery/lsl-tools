  llWhisper:
    name: llWhisper
    type: function
    description: Broadcasts the message msg to all scripts or agents listening on channel within llGetEnv("whisper_range"),
      which is 10m on most regions. Agents listen on PUBLIC_CHANNEL (0) and DEBUG_CHANNEL (2147483647).
      All other channels are for script-to-script communication.
    return: void
    energy: 10.0
    sleep: 0.0
    function-id: 22
    params:
    - name: channel
      type: integer
      description: Chat channel (any 32-bit signed integer value) to whisper the message on.
    - name: msg
      type: string
      description: Text message string to broadcast.
    categories:
    - avatar_communication
    - chat
    - script_communication
    deprecated: false
    status: active
    related:
      slwiki: []
      constants: []
      events: []
      functions: []
