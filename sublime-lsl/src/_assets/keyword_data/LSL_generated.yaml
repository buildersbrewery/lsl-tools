    value_type: integer
    member_of:
    - PrimType
    status: active
  PRIM_TYPE_TORUS:
    name: PRIM_TYPE_TORUS
    type: constant
    description: Shape parameter for PRIM_TYPE used to define the prim as a torus and configure its shape
      properties.
    value: 4
    value_type: integer
    member_of:
    - PrimType
    status: active
  PRIM_TYPE_TUBE:
    name: PRIM_TYPE_TUBE
    type: constant
    description: Shape parameter for PRIM_TYPE used to define the prim as a tube and configure its shape
      properties.
    value: 5
    value_type: integer
    member_of:
    - PrimType
    status: active
  PROFILE_NONE:
