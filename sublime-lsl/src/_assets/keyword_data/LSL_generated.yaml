constants:
  ACTIVE:
    name: ACTIVE
    type: constant
    description: Objects running a script or physically moving (using server resources). In llDetectedType(),
      it identifies physical objects and agents. In llSensor() or llSensorRepeat(), it searches for moving
      physical objects or scripted objects.
    value: '0x2'
    value_type: integer
    member_of:
    - DetectType
    status: active
  AGENT:
    name: AGENT
    type: constant
    description: Agents (avatars). In llDetectedType, it indicates an avatar. In llSensor or llSensorRepeat,
      it searches for avatars by legacy name (functionally identical to AGENT_BY_LEGACY_NAME, though using
      AGENT_BY_LEGACY_NAME is recommended instead).
    value: '0x1'
    value_type: integer
    member_of:
    - DetectType
    status: active
  AGENT_ALWAYS_RUN:
    name: AGENT_ALWAYS_RUN
    type: constant
    description: Used with llGetAgentInfo to determine if the queried avatar has 'Always Run' enabled
      or is using tap-tap-hold.
    value: '0x1000'
    value_type: integer
    member_of:
    - AgentInfo
    status: active
  AGENT_ATTACHMENTS:
    name: AGENT_ATTACHMENTS
    type: constant
    description: Used with llGetAgentInfo to determine if the queried avatar has attachments.
    value: '0x2'
    value_type: integer
    member_of:
    - AgentInfo
    status: active
  AGENT_AUTOMATED:
    name: AGENT_AUTOMATED
    type: constant
    description: Used with llGetAgentInfo to identify if the avatar is registered with Linden Lab as an
      automated/scripted agent (bot).
    value: '0x4000'
    value_type: integer
    member_of:
    - AgentInfo
    status: active
  AGENT_AUTOPILOT:
    name: AGENT_AUTOPILOT
    type: constant
    description: Used with llGetAgentInfo to determine if the avatar is in autopilot mode, which is enabled
      when the user selects 'Go Here' on the ground or uses double-click autopilot.
    value: '0x2000'
    value_type: integer
    member_of:
    - AgentInfo
    status: active
  AGENT_AWAY:
    name: AGENT_AWAY
    type: constant
    description: Used with llGetAgentInfo to determine if the avatar is in 'away' mode, which indicates
      they toggled away or have been inactive for too long.
    value: '0x40'
    value_type: integer
    member_of:
    - AgentInfo
    status: active
  AGENT_BUSY:
    name: AGENT_BUSY
    type: constant
    description: Used with llGetAgentInfo to determine if the avatar is in 'busy' mode.
    value: '0x800'
    value_type: integer
    member_of:
    - AgentInfo
    status: active
  AGENT_BY_LEGACY_NAME:
    name: AGENT_BY_LEGACY_NAME
    type: constant
    description: Used to find agents by legacy name. In llDetectedType, it indicates an avatar. In llSensor
      or llSensorRepeat, it searches for avatars by legacy name.
    value: '0x1'
    value_type: integer
    member_of:
    - DetectType
    status: active
