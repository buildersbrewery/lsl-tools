events:
  at_rot_target:
    name: at_rot_target
    type: event
    description: Triggered when the script's rotation (ourrot) comes within a defined angle (error) of
      the target rotation (targetrot) set by a call to llRotTarget (which returns the associated handle).
    params:
    - handle:
        tooltip: Integer handle returned by the llRotTarget call.
        type: integer
    - targetrot:
        tooltip: Target rotation specified in the llRotTarget call.
        type: rotation
    - ourrot:
        tooltip: Current rotation of the object (similar to llGetRot).
        type: rotation
    status: active
  at_target:
    name: at_target
    type: event
    description: Triggered when the scripted object's position (ourpos) comes within the defined range
      of the target position (targetpos) set by llTarget (which returns the associated handle tnum).
    params:
    - tnum:
        tooltip: Integer target handle returned by the llTarget call.
        type: integer
    - targetpos:
        tooltip: Target position vector specified in the llTarget call.
        type: vector
    - ourpos:
        tooltip: Current position vector of the object (similar to llGetPos).
        type: vector
    status: active
  attach:
    name: attach
    type: event
    description: Triggered whenever the object is attached to or detached from an avatar. Passes the UUID
      key of the avatar if attached, or NULL_KEY if detached.
    params:
    - avatar:
        tooltip: UUID of the avatar the object is attached to, or NULL_KEY if detached.
        type: key
    status: active
  changed:
    name: changed
    type: event
    description: Triggered when various properties of the object change. The parameter changes is a bitfield
      of CHANGED_* flags.
    params:
    - changes:
        tooltip: A bitfield of CHANGED_* flags representing what changed.
        type: integer
        enum-semantics: ChangeType
    status: active
  collision:
    name: collision
    type: event
    description: Triggered continuously while an avatar or another object is colliding with the object
      containing the script. Passes num_detected, representing the number of detected collisions.
    params:
    - num_detected:
        tooltip: Total number of detected colliders (usable with llDetected* functions).
        type: integer
    status: active
  collision_end:
    name: collision_end
    type: event
    description: Triggered when an avatar or another object stops colliding with the object containing
      the script. Passes num_detected, representing the number of detected collisions.
    params:
    - num_detected:
        tooltip: Total number of detected colliders (usable with llDetected* functions).
        type: integer
    status: active
  collision_start:
    name: collision_start
    type: event
    description: Triggered when an avatar or another object first begins colliding with the object containing
      the script. Passes num_detected, representing the number of detected collisions.
    params:
    - num_detected:
        tooltip: Total number of detected colliders (usable with llDetected* functions).
        type: integer
    status: active
  control:
    name: control
    type: event
    description: Triggered to pass captured avatar control inputs into the script. The parameter level
      indicates held controls, and edge indicates change in controls (both are bitfields of CONTROL_*
      constants).
    params:
    - id:
        tooltip: UUID of the avatar whose inputs are captured.
        type: key
    - level:
        tooltip: A bitfield of CONTROL_* constants representing currently held controls.
        type: integer
        enum-semantics: ControlButton
    - edge:
        tooltip: A bitfield of CONTROL_* constants representing controls that just changed state.
        type: integer
        enum-semantics: ControlButton
    status: active
  dataserver:
    name: dataserver
    type: event
    description: Triggered when requested data is returned to the script (e.g., from llRequestAgentData,
      llRequestInventoryData, or llGetNotecardLine).
    params:
    - queryid:
        tooltip: Key identifying the asynchronous request (matches the handle returned by the requesting
          function).
        type: key
    - data:
        tooltip: String containing the requested data.
        type: string
    status: active
  email:
    name: email
    type: event
    description: Receive an email requested by llGetNextEmail(). NumberRemaining indicates the number
      of emails remaining in the queue for llGetNextEmail() to retrieve.
    params:
    - time:
        tooltip: Timestamp of when the email was received, in (string)llGetUnixTime() format.
        type: string
    - address:
        tooltip: Email address of the sender.
        type: string
    - subject:
        tooltip: Subject of the email.
        type: string
    - msg:
        tooltip: Body text of the email.
        type: string
    - num_left:
        tooltip: Number of emails still waiting in the queue.
        type: integer
    status: active
  experience_permissions:
    name: experience_permissions
    type: event
    description: Triggered when the agent specified by agent_id approves an experience permissions request
      (interactively or automatically if previously approved).
    params:
    - agent_id:
        tooltip: UUID of the avatar approving experience permissions.
        type: key
    status: active
  experience_permissions_denied:
    name: experience_permissions_denied
    type: event
    description: Triggered when the agent specified by agent_id denies experience permissions, or when
      permission is blocked for other reasons (specified by the error code reason).
    params:
    - agent_id:
        tooltip: UUID of the avatar who denied or was blocked from granting permissions.
        type: key
    - reason:
        tooltip: XP_ERROR_* error constant describing why permissions were denied.
        type: integer
        enum-semantics: ExperienceError
    status: active
  final_damage:
    name: final_damage
    type: event
    description: Triggered after all on_damage events across all scripts have completed and damage is
      actively applied to the avatar or distributed among seated avatars. Collision detected functions
      (llDetected*) and llDetectedDamage are available.
    params:
    - num_detected:
        tooltip: Number of damage events applied to the avatar or task.
        type: integer
    status: active
  game_control:
    name: game_control
    type: event
    description: Triggered when a compatible viewer sends game controller input changes for the avatar
      specified by id. Only triggers for scripts in attachments or seats.
    params:
    - id:
        tooltip: UUID of the avatar supplying controller input.
        type: key
    - button_levels:
        tooltip: A 32-bit mask representing the buttons currently held down on the controller.
        type: integer
        enum-semantics: GameControlButton
    - axes:
        tooltip: A list of six float values in the range [-1.0, 1.0] representing controller axes.
        type: list
        slua-type: '{number}'
    status: active
  http_request:
    name: http_request
    type: event
    description: Triggered when the script's registered URL receives an incoming HTTP request identified
      by request_id.
    params:
    - request_id:
        tooltip: Unique key identifying the incoming HTTP request (used with llHTTPResponse).
        type: key
    - method:
        tooltip: HTTP method string ('GET', 'POST', 'PUT', 'DELETE') or URL request status constants.
        type: string
    - body:
        tooltip: String payload of the incoming request body.
        type: string
    status: active
  http_response:
    name: http_response
    type: event
    description: Triggered when an HTTP response body is received for a pending request_id, or if the
      request fails or times out.
    params:
    - request_id:
        tooltip: Key matching the handle returned by the initiating llHTTPRequest call.
        type: key
    - status:
        tooltip: Integer HTTP status code returned (such as 200 or 404).
        type: integer
    - metadata:
        tooltip: A list of HTTP_* constants and response headers metadata.
        type: list
        param-semantics: HTTPResponseError
    - body:
        tooltip: String payload of the received response body.
        type: string
    status: active
  land_collision:
    name: land_collision
    type: event
    description: Triggered in the root prim when a physical object or attached avatar is colliding with
      the ground at position pos.
    params:
    - pos:
        tooltip: Vector position of collision with the ground.
        type: vector
    status: active
  land_collision_end:
    name: land_collision_end
    type: event
    description: Triggered in the root prim when a physical object or attached avatar stops colliding
      with the ground at position pos.
    params:
    - pos:
        tooltip: Vector position of the last ground collision.
        type: vector
    status: active
  land_collision_start:
    name: land_collision_start
    type: event
    description: Triggered in the root prim when a physical object or attached avatar first begins colliding
      with the ground at position pos.
    params:
    - pos:
        tooltip: Vector position of collision with the ground.
        type: vector
    status: active
  link_message:
    name: link_message
    type: event
    description: Triggered when the script receives a link message from sender_num, containing the parameters
      num, str, and id sent via llMessageLinked.
    params:
    - sender_num:
        tooltip: Link index of the prim containing the script that sent the message.
        type: integer
    - num:
        tooltip: An integer value passed from the sending script.
        type: integer
    - str:
        tooltip: A text string value passed from the sending script.
        type: string
    - id:
        tooltip: A key value passed from the sending script.
        type: key
        slua-type: string
    status: active
  linkset_data:
    name: linkset_data
    type: event
    description: Fires in all scripts in the linkset whenever the datastore has been modified via an llLinksetData
      function. Passes the action taken, the affected key name, and the new value.
    params:
    - action:
        tooltip: An integer constant representing the action taken (e.g., LINKSETDATA_UPDATE, LINKSETDATA_DELETE,
          LINKSETDATA_RESET).
        type: integer
        enum-semantics: LinksetDataAction
    - name:
        tooltip: Key name of the modified key-value pair.
        type: string
    - value:
        tooltip: New string value of the pair (empty if the pair was deleted or is password-protected).
        type: string
    status: active
  listen:
    name: listen
    type: event
    description: Triggered when a chat message matching active llListen filters is received on channel.
      Passes the sender's name and UUID key id, along with the spoken string msg.
    params:
    - channel:
        tooltip: Chat channel where the message appeared.
        type: integer
        enum-semantics: Channel
    - name:
        tooltip: Name of the sending prim or the legacy name of the sending agent.
        type: string
    - id:
        tooltip: UUID of the sending agent or prim.
        type: key
    - msg:
        tooltip: Spoken text string.
        type: string
    status: active
  money:
    name: money
    type: event
    description: Triggered when a resident specified by id pays an amount of Linden dollars (L$) to the
      prim.
    params:
    - id:
        tooltip: UUID of the paying resident.
        type: key
    - amount:
        tooltip: Quantity of L$ paid to the prim.
        type: integer
    status: active
  moving_end:
    name: moving_end
    type: event
    description: Triggered whenever the physical or moving object containing the script stops moving.
    params: []
    status: active
  moving_start:
    name: moving_start
    type: event
    description: Triggered whenever the physical or moving object containing the script starts moving.
    params: []
    status: active
  no_sensor:
    name: no_sensor
    type: event
    description: Triggered when active sensors (from llSensor or llSensorRepeat) complete a scan without
      finding any matching targets.
    params: []
    status: active
  not_at_rot_target:
    name: not_at_rot_target
    type: event
    description: Triggered continuously while the object's rotation is outside the leeway angle of targets
      set via llRotTarget.
    params: []
    status: active
  not_at_target:
    name: not_at_target
    type: event
    description: Triggered continuously while the object's position has not yet reached the range of targets
      set via llTarget.
    params: []
    status: active
  object_rez:
    name: object_rez
    type: event
    description: Triggered when this object successfully rezzes another object from its inventory. Passes
      the key (UUID) id of the newly rezzed object.
    params:
    - id:
        tooltip: UUID of the newly rezzed object.
        type: key
    status: active
  on_damage:
    name: on_damage
    type: event
    description: Triggered when damage has been inflicted on an avatar or task, but before it is applied
      or distributed. Collision detected functions (llDetected*), llDetectedDamage, and llAdjustDamage
      are available. Passes num_detected, representing the number of pending damage events.
    params:
    - num_detected:
        tooltip: Number of pending damage events.
        type: integer
    status: active
  on_death:
    name: on_death
    type: event
    description: Triggered on all worn attachments when the wearing avatar's health reaches 0.
    params: []
    status: active
  on_rez:
    name: on_rez
    type: event
    description: Triggered when the object is rezzed into the world (by a script or user). Passes start_param
      from the rezzing call (or 0 if rezzed from inventory). Also triggers on attachments during login
      or when attached from inventory.
    params:
    - start_param:
        tooltip: Integer start parameter passed from the rezzing call.
        type: integer
    status: active
  path_update:
    name: path_update
    type: event
    description: Triggered to inform the script of changes or failures in the pathfinding character's
      status.
    params:
    - type:
        tooltip: Path update status or failure code constant (PU_* flag).
        type: integer
        enum-semantics: CharacterPathUpdateType
    - reserved:
        tooltip: Reserved parameter (currently unused).
        type: list
    status: active
  remote_data:
    name: remote_data
    type: event
    description: Deprecated. Triggered by incoming XML-RPC calls, passing event_type, channel, message_id,
      sender, idata, and sdata.
    params:
    - event_type:
        tooltip: Integer constant representing the type of XML-RPC event.
        type: integer
        enum-semantics: RemoteDataEventType
    - channel:
        tooltip: XML-RPC channel ID key.
        type: key
    - message_id:
        tooltip: XML-RPC message ID key.
        type: key
    - sender:
        tooltip: XML-RPC sender string.
        type: string
    - idata:
        tooltip: Payload integer data.
        type: integer
    - sdata:
        tooltip: Payload string data.
        type: string
    status: active
  run_time_permissions:
    name: run_time_permissions
    type: event
    description: Triggered when an agent grants or denies runtime permissions requested by llRequestPermissions.
      Passes the active integer permissions bitfield perm (returns 0 if no permissions are currently granted).
    params:
    - perm:
        tooltip: Bitfield of currently granted permissions (PERMISSION_* flags).
        type: integer
        enum-semantics: ScriptPermission
    status: active
  sensor:
    name: sensor
    type: event
    description: Triggered when objects matching constraints of llSensor or llSensorRepeat are successfully
      detected. Passes num_detected, representing the number of detected targets.
    params:
    - num_detected:
        tooltip: Total number of detected targets found (usable with llDetected* functions).
        type: integer
    status: active
  state_entry:
    name: state_entry
    type: event
    description: Triggered immediately whenever a new state is entered (including at script start). It
      is always the first event handled.
    params: []
    status: active
  state_exit:
    name: state_exit
    type: event
    description: Triggered when the state command is used to transition out of the current state. Handled
      before entering the new state's state_entry.
    params: []
    status: active
  timer:
    name: timer
    type: event
    description: Triggered at regular periodic intervals configured by llSetTimerEvent.
    params: []
    status: active
  touch:
    name: touch
    type: event
    description: Triggered continuously while an avatar touches the object. Passes num_detected, representing
      the number of touching agents.
    params:
    - num_detected:
        tooltip: Total number of touching agents detected (usable with llDetected* functions).
        type: integer
    status: active
  touch_end:
    name: touch_end
    type: event
    description: Triggered when an avatar stops touching the object. Passes num_detected, representing
      the number of touching agents.
    params:
    - num_detected:
        tooltip: Total number of touching agents detected (usable with llDetected* functions).
        type: integer
    status: active
  touch_start:
    name: touch_start
    type: event
    description: Triggered when an avatar first touches the object. Passes num_detected, representing
      the number of touching agents.
    params:
    - num_detected:
        tooltip: Total number of touching agents detected (usable with llDetected* functions).
        type: integer
    status: active
  transaction_result:
    name: transaction_result
    type: event
    description: Triggered when an asynchronous L$ transfer (such as llTransferLindenDollars) is completed.
      Passes transaction info id, success status, and CSV or error data.
    params:
    - id:
        tooltip: Key matching the handle returned by the initiating llTransfer* function.
        type: key
    - success:
        tooltip: Boolean. TRUE if the L$ transfer succeeded, FALSE otherwise.
        type: integer
        bool-semantics: true
    - data:
        tooltip: Contains a CSV string of transaction info on success, or an error string on failure.
        type: string
    status: active
