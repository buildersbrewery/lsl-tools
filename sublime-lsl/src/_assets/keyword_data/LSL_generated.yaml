    name: llWorldPosToHUD
    type: function
    description: Returns the local position vector that places the center of the HUD object directly over
      the world coordinate world_pos as viewed by the current camera. Requires the PERMISSION_TRACK_CAMERA
      runtime permission.
    return: vector
    energy: 10.0
    sleep: 0.0
    function-id: 547
    params:
    - name: world_pos
