    status: active
  PROFILE_SCRIPT_MEMORY:
    name: PROFILE_SCRIPT_MEMORY
    type: constant
    description: Enables script memory profiling, tracking the maximum amount of memory consumed while
      it is active.
    value: 1
    value_type: integer
    member_of:
    - ScriptProfileMode
    status: active
  PSYS_PART_BF_DEST_COLOR:
    name: PSYS_PART_BF_DEST_COLOR
    type: constant
    description: Scales the RGBA values by the RGBA values of the destination.
    value: 2
    value_type: integer
    member_of:
    - ParticleBlendFunc
    status: active
  PSYS_PART_BF_ONE:
    name: PSYS_PART_BF_ONE
    type: constant
    description: PSYS_PART_BF_ONE
    value: 0
    value_type: integer
    member_of:
    - ParticleBlendFunc
    status: active
  PSYS_PART_BF_ONE_MINUS_DEST_COLOR:
    name: PSYS_PART_BF_ONE_MINUS_DEST_COLOR
    type: constant
    description: Scales the RGBA values by the inverted RGBA values of the destination.
    value: 4
    value_type: integer
    member_of:
    - ParticleBlendFunc
    status: active
  PSYS_PART_BF_ONE_MINUS_SOURCE_ALPHA:
    name: PSYS_PART_BF_ONE_MINUS_SOURCE_ALPHA
    type: constant
    description: Scales the RGBA values by the inverted alpha values of the particle source.
    value: 9
    value_type: integer
    member_of:
    - ParticleBlendFunc
    status: active
  PSYS_PART_BF_ONE_MINUS_SOURCE_COLOR:
    name: PSYS_PART_BF_ONE_MINUS_SOURCE_COLOR
    type: constant
    description: Scales the RGBA values by the inverted RGBA values of the particle source.
    value: 5
    value_type: integer
    member_of:
    - ParticleBlendFunc
    status: active
  PSYS_PART_BF_SOURCE_ALPHA:
    name: PSYS_PART_BF_SOURCE_ALPHA
    type: constant
    description: Scales the RGBA values by the alpha values of the particle source.
    value: 7
    value_type: integer
    member_of:
    - ParticleBlendFunc
    status: active
  PSYS_PART_BF_SOURCE_COLOR:
    name: PSYS_PART_BF_SOURCE_COLOR
    type: constant
    description: Scales the RGBA values by the RGBA values of the particle source.
    value: 3
    value_type: integer
    member_of:
    - ParticleBlendFunc
    status: active
  PSYS_PART_BF_ZERO:
    name: PSYS_PART_BF_ZERO
    type: constant
    description: Zeros out the source or destination RGBA values.
    value: 1
    value_type: integer
    member_of:
    - ParticleBlendFunc
    status: active
  PSYS_PART_BLEND_FUNC_DEST:
    name: PSYS_PART_BLEND_FUNC_DEST
    type: constant
    description: Integer parameter defining the destination blending function.
    value: 25
    value_type: integer
    member_of:
    - ParticleParam
    status: active
  PSYS_PART_BLEND_FUNC_SOURCE:
    name: PSYS_PART_BLEND_FUNC_SOURCE
    type: constant
    description: Integer parameter defining the source blending function.
    value: 24
    value_type: integer
    member_of:
    - ParticleParam
    status: active
  PSYS_PART_BOUNCE_MASK:
    name: PSYS_PART_BOUNCE_MASK
    type: constant
    description: Particle flag causing particles to bounce off a plane at the emitter object's Z height.
    value: '0x4'
    value_type: integer
    member_of:
    - ParticleFlag
    status: active
  PSYS_PART_EMISSIVE_MASK:
    name: PSYS_PART_EMISSIVE_MASK
    type: constant
    description: Particle flag that makes particles full-bright and unaffected by global lighting (sunlight).
      Otherwise, particles are lit by current global lighting or local point lights.
    value: '0x100'
    value_type: integer
    member_of:
    - ParticleFlag
    status: active
  PSYS_PART_END_ALPHA:
    name: PSYS_PART_END_ALPHA
    type: constant
    description: Float parameter that determines the ending alpha (transparency) of the particles.
    value: 4
    value_type: integer
    member_of:
    - ParticleParam
    status: active
  PSYS_PART_END_COLOR:
    name: PSYS_PART_END_COLOR
    type: constant
    description: Vector parameter <r, g, b> that determines the ending color of the particles.
    value: 3
    value_type: integer
    member_of:
    - ParticleParam
    status: active
  PSYS_PART_END_GLOW:
    name: PSYS_PART_END_GLOW
    type: constant
    description: Float parameter that determines the ending glow value of the particles.
    value: 27
    value_type: integer
    member_of:
    - ParticleParam
    status: active
  PSYS_PART_END_SCALE:
    name: PSYS_PART_END_SCALE
    type: constant
    description: Vector parameter <sx, sy, z> defining the ending size of the particle billboard in meters
      (z-axis value is ignored).
    value: 6
    value_type: integer
    member_of:
    - ParticleParam
    status: active
  PSYS_PART_FLAGS:
    name: PSYS_PART_FLAGS
    type: constant
    description: Integer bitfield parameter specifying the simulation flags for emitted particles. Multiple
      flags can be combined using bitwise OR (|).
    value: 0
    value_type: integer
    member_of:
    - ParticleParam
    status: active
  PSYS_PART_FOLLOW_SRC_MASK:
    name: PSYS_PART_FOLLOW_SRC_MASK
    type: constant
    description: Particle flag causing particle positions to remain relative to the position and movement
      of the emitter. Enabling this flag disables the PSYS_SRC_BURST_RADIUS rule.
    value: '0x10'
    value_type: integer
    member_of:
    - ParticleFlag
    status: active
  PSYS_PART_FOLLOW_VELOCITY_MASK:
    name: PSYS_PART_FOLLOW_VELOCITY_MASK
    type: constant
    description: Particle flag causing particles to rotate and orient their vertical 'top' toward their
      direction of movement or emission. Otherwise, they remain vertically oriented with the top of the
      texture facing up.
    value: '0x20'
    value_type: integer
    member_of:
    - ParticleFlag
    status: active
  PSYS_PART_INTERP_COLOR_MASK:
    name: PSYS_PART_INTERP_COLOR_MASK
    type: constant
    description: Particle flag causing the particle's color and alpha to smoothly interpolate from their
      START values to their END values over its lifetime.
    value: '0x1'
    value_type: integer
    member_of:
    - ParticleFlag
    status: active
  PSYS_PART_INTERP_SCALE_MASK:
    name: PSYS_PART_INTERP_SCALE_MASK
    type: constant
    description: Particle flag causing the particle's size/scale to transition from its START setting
      to its END setting over its lifetime.
    value: '0x2'
    value_type: integer
    member_of:
    - ParticleFlag
    status: active
  PSYS_PART_MAX_AGE:
    name: PSYS_PART_MAX_AGE
    type: constant
    description: Float parameter specifying the lifetime (age in seconds) of an individual particle before
      it dies.
    value: 7
    value_type: integer
    member_of:
    - ParticleParam
    status: active
  PSYS_PART_RIBBON_MASK:
    name: PSYS_PART_RIBBON_MASK
    type: constant
    description: Particle flag that joins emitted particles into a continuous ribbon strip. Textures stretch
      to join adjacent edges. Width is controlled by the 'x' start/end scale; 'y' controls maximum visibility
      distance. Ribbon segments are not camera-facing, mimic the emitter's Z-axis, and require horizontal
      movement to render.
    value: '0x400'
    value_type: integer
    member_of:
    - ParticleFlag
    status: active
  PSYS_PART_START_ALPHA:
    name: PSYS_PART_START_ALPHA
    type: constant
    description: Float parameter that determines the starting alpha (transparency) of the particles.
    value: 2
    value_type: integer
    member_of:
    - ParticleParam
    status: active
  PSYS_PART_START_COLOR:
    name: PSYS_PART_START_COLOR
    type: constant
    description: Vector parameter <r, g, b> that determines the starting color of the particles.
    value: 1
    value_type: integer
    member_of:
    - ParticleParam
    status: active
  PSYS_PART_START_GLOW:
    name: PSYS_PART_START_GLOW
    type: constant
    description: Float parameter that determines the starting glow value of the particles.
    value: 26
    value_type: integer
    member_of:
    - ParticleParam
    status: active
  PSYS_PART_START_SCALE:
    name: PSYS_PART_START_SCALE
    type: constant
    description: Vector parameter <sx, sy, z> defining the starting size of the particle billboard in
      meters (z-axis value is ignored).
    value: 5
    value_type: integer
    member_of:
    - ParticleParam
    status: active
  PSYS_PART_TARGET_LINEAR_MASK:
    name: PSYS_PART_TARGET_LINEAR_MASK
    type: constant
    description: Particle flag causing emitted particles to move in a straight, evenly-spaced line toward
      the PSYS_SRC_TARGET_KEY target. Ignores non-DROP patterns, radius, burst speeds, angles, omega,
      acceleration, and wind. Combining with bounce while target is below emitter deflects particles upward.
    value: '0x80'
    value_type: integer
    member_of:
    - ParticleFlag
    status: active
  PSYS_PART_TARGET_POS_MASK:
    name: PSYS_PART_TARGET_POS_MASK
    type: constant
    description: Particle flag causing emitted particles to change course and travel toward the target
      specified by PSYS_SRC_TARGET_KEY during their lifetime. If no valid or reachable target is set,
      particles target the emitting prim itself.
    value: '0x40'
    value_type: integer
    member_of:
    - ParticleFlag
    status: active
  PSYS_PART_WIND_MASK:
    name: PSYS_PART_WIND_MASK
    type: constant
    description: Particle flag that applies wind as a secondary force on the particles, damping their
      velocity toward the wind velocity.
    value: '0x8'
    value_type: integer
    member_of:
    - ParticleFlag
    status: active
  PSYS_SRC_ACCEL:
    name: PSYS_SRC_ACCEL
    type: constant
    description: Vector parameter <x, y, z> specifying the constant acceleration to apply to particles.
    value: 8
    value_type: integer
    member_of:
    - ParticleParam
    status: active
  PSYS_SRC_ANGLE_BEGIN:
    name: PSYS_SRC_ANGLE_BEGIN
    type: constant
    description: Float parameter specifying the angle in radians where particles will not be created (for
      ANGLE patterns).
    value: 22
    value_type: integer
    member_of:
    - ParticleParam
    status: active
  PSYS_SRC_ANGLE_END:
    name: PSYS_SRC_ANGLE_END
    type: constant
    description: Float parameter specifying the ending angle in radians to be filled with particles (for
      ANGLE patterns). If smaller than angle_begin, their roles are swapped.
    value: 23
    value_type: integer
    member_of:
    - ParticleParam
    status: active
  PSYS_SRC_BURST_PART_COUNT:
    name: PSYS_SRC_BURST_PART_COUNT
    type: constant
    description: Integer parameter specifying the number of particles to release in each burst.
    value: 15
    value_type: integer
    member_of:
    - ParticleParam
    status: active
  PSYS_SRC_BURST_RADIUS:
    name: PSYS_SRC_BURST_RADIUS
    type: constant
    description: Float parameter specifying the radial distance from the emitter's center at which particles
      are created.
    value: 16
    value_type: integer
    member_of:
    - ParticleParam
    status: active
  PSYS_SRC_BURST_RATE:
    name: PSYS_SRC_BURST_RATE
    type: constant
    description: Float parameter specifying the interval in seconds between particle bursts.
    value: 13
    value_type: integer
    member_of:
    - ParticleParam
    status: active
  PSYS_SRC_BURST_SPEED_MAX:
    name: PSYS_SRC_BURST_SPEED_MAX
    type: constant
    description: Float parameter specifying the maximum initial speed of emitted particles.
    value: 18
    value_type: integer
    member_of:
    - ParticleParam
    status: active
  PSYS_SRC_BURST_SPEED_MIN:
    name: PSYS_SRC_BURST_SPEED_MIN
    type: constant
    description: Float parameter specifying the minimum initial speed of emitted particles.
    value: 17
    value_type: integer
    member_of:
    - ParticleParam
    status: active
  PSYS_SRC_INNERANGLE:
    name: PSYS_SRC_INNERANGLE
    type: constant
    description: Float parameter specifying the inner angle of the arc for ANGLE or ANGLE_CONE patterns.
      The specified inner area will not contain particles.
    value: 10
    value_type: integer
    member_of:
    - ParticleParam
    status: active
  PSYS_SRC_MAX_AGE:
    name: PSYS_SRC_MAX_AGE
    type: constant
    description: Float parameter specifying the active duration of the particle system in seconds (0.0
      means forever).
    value: 19
    value_type: integer
    member_of:
    - ParticleParam
    status: active
  PSYS_SRC_OBJ_REL_MASK:
    name: PSYS_SRC_OBJ_REL_MASK
    type: constant
    description: ''
    value: '0x1'
    value_type: integer
    member_of:
    - ParticleParam
    status: active
  PSYS_SRC_OMEGA:
    name: PSYS_SRC_OMEGA
    type: constant
    description: Vector parameter setting the angular velocity used to rotate the emission axis for ANGLE
      and ANGLE_CONE patterns.
    value: 21
    value_type: integer
    member_of:
    - ParticleParam
    status: active
  PSYS_SRC_OUTERANGLE:
    name: PSYS_SRC_OUTERANGLE
    type: constant
    description: Float parameter specifying the outer angle of the arc for ANGLE or ANGLE_CONE patterns.
      The area between the outer and inner angles is filled with particles.
    value: 11
    value_type: integer
    member_of:
    - ParticleParam
    status: active
  PSYS_SRC_PATTERN:
    name: PSYS_SRC_PATTERN
    type: constant
    description: Integer parameter specifying the generation pattern (PSYS_SRC_PATTERN_*) used to emit
      particles.
    value: 9
    value_type: integer
    member_of:
    - ParticleParam
    status: active
  PSYS_SRC_PATTERN_ANGLE:
    name: PSYS_SRC_PATTERN_ANGLE
    type: constant
    description: Emission pattern that sprays particles outward in a flat circular, semi-circular, arc,
      or ray-shaped 2D area (around the prim's local X-axis) as defined by the start/end and inner/outer
      angle parameters.
    value: '0x04'
    value_type: integer
    member_of:
    - ParticleSourcePattern
    status: active
  PSYS_SRC_PATTERN_ANGLE_CONE:
    name: PSYS_SRC_PATTERN_ANGLE_CONE
    type: constant
    description: Emission pattern that sprays particles outward in a 3D spherical, conical, or ring-shaped
      area defined by the start/end and inner/outer angle parameters. Can emulate the EXPLODE pattern
      if angles are set to 0.0 and PI.
    value: '0x08'
    value_type: integer
    member_of:
    - ParticleSourcePattern
    status: active
  PSYS_SRC_PATTERN_ANGLE_CONE_EMPTY:
    name: PSYS_SRC_PATTERN_ANGLE_CONE_EMPTY
    type: constant
    description: Incomplete emission pattern that behaves identically to the DROP pattern. Intended to
      invert the ANGLE parameters to define an empty area where particles are not sprayed.
    value: '0x10'
    value_type: integer
    member_of:
    - ParticleSourcePattern
    status: active
  PSYS_SRC_PATTERN_DROP:
    name: PSYS_SRC_PATTERN_DROP
    type: constant
    description: Emission pattern that drops particles at the source position with no initial velocity.
      Overrides burst radius, minimum speed, and maximum speed settings to 0.0.
    value: '0x01'
    value_type: integer
    member_of:
    - ParticleSourcePattern
    status: active
  PSYS_SRC_PATTERN_EXPLODE:
    name: PSYS_SRC_PATTERN_EXPLODE
    type: constant
    description: Emission pattern that shoots particles outward in all directions using the burst parameters.
    value: '0x02'
    value_type: integer
    member_of:
    - ParticleSourcePattern
    status: active
  PSYS_SRC_TARGET_KEY:
    name: PSYS_SRC_TARGET_KEY
    type: constant
    description: Key (UUID) of the target object that particles travel toward when PSYS_PART_TARGET_POS_MASK
      or PSYS_PART_TARGET_LINEAR_MASK is enabled.
    value: 20
    value_type: integer
    member_of:
    - ParticleParam
    status: active
  PSYS_SRC_TEXTURE:
    name: PSYS_SRC_TEXTURE
    type: constant
    description: String parameter specifying the inventory name or UUID asset key of the texture used
      for the particles.
    value: 12
    value_type: integer
    member_of:
    - ParticleParam
    status: active
  PUBLIC_CHANNEL:
    name: PUBLIC_CHANNEL
    type: constant
    description: Integer constant representing the open local chat channel. Passing this to chat functions
      (llSay, llWhisper, llShout) prints text to the publicly heard chat seen by nearby users and objects.
    value: 0
    value_type: integer
    member_of:
    - Channel
    status: active
  PURSUIT_FUZZ_FACTOR:
    name: PURSUIT_FUZZ_FACTOR
    type: constant
    description: Option for llPursue that selects a random destination near the PURSUIT_OFFSET (range
      is 0 to 1, where 1 is most random). Requires a non-zero PURSUIT_OFFSET.
    value: 3
    value_type: integer
    member_of:
    - CharacterPursueParam
    status: active
  PURSUIT_GOAL_TOLERANCE:
    name: PURSUIT_GOAL_TOLERANCE
    type: constant
    description: Option for llPursue defining how close (between 0.25m and 10m) the character must be
      to consider the goal reached.
    value: 5
    value_type: integer
    member_of:
    - CharacterPursueParam
    status: active
  PURSUIT_INTERCEPT:
    name: PURSUIT_INTERCEPT
    type: constant
    description: Option for llPursue specifying whether the pathfinding character attempts to predict
      and intercept the target's future location.
    value: 4
    value_type: integer
    member_of:
    - CharacterPursueParam
    status: active
  PURSUIT_OFFSET:
    name: PURSUIT_OFFSET
    type: constant
    description: Option for llPursue specifying a constant position offset relative to the target for
      the character to navigate toward.
    value: 1
    value_type: integer
    member_of:
    - CharacterPursueParam
    status: active
  PU_EVADE_HIDDEN:
    name: PU_EVADE_HIDDEN
    type: constant
    description: Path update status code triggered when an llEvade character determines it has successfully
      hidden from its pursuer.
    value: '0x07'
    value_type: integer
    member_of:
    - CharacterPathUpdateType
    status: active
  PU_EVADE_SPOTTED:
    name: PU_EVADE_SPOTTED
    type: constant
    description: Path update status code triggered when an llEvade character switches from hiding to running.
    value: '0x08'
    value_type: integer
    member_of:
    - CharacterPathUpdateType
    status: active
  PU_FAILURE_DYNAMIC_PATHFINDING_DISABLED:
    name: PU_FAILURE_DYNAMIC_PATHFINDING_DISABLED
    type: constant
    description: Path update failure code triggered when a character enters a region where dynamic pathfinding
      has been disabled in the Region Debug Console.
    value: 10
    value_type: integer
    member_of:
    - CharacterPathUpdateType
    status: active
  PU_FAILURE_INVALID_GOAL:
    name: PU_FAILURE_INVALID_GOAL
    type: constant
    description: Path update failure code triggered when the specified goal is not on the region's navigation
      mesh (navmesh) and is unreachable.
    value: '0x03'
    value_type: integer
    member_of:
    - CharacterPathUpdateType
    status: active
  PU_FAILURE_INVALID_START:
    name: PU_FAILURE_INVALID_START
    type: constant
    description: Path update failure code triggered when the character is at an unnavigable starting position
      (e.g., off the navmesh or too high above it).
    value: '0x02'
    value_type: integer
    member_of:
    - CharacterPathUpdateType
    status: active
  PU_FAILURE_NO_NAVMESH:
    name: PU_FAILURE_NO_NAVMESH
    type: constant
    description: Path update fatal error triggered when there is no navmesh generated for the region (typically
      indicates a server failure).
    value: '0x09'
    value_type: integer
    member_of:
    - CharacterPathUpdateType
    status: active
  PU_FAILURE_NO_VALID_DESTINATION:
    name: PU_FAILURE_NO_VALID_DESTINATION
    type: constant
    description: Path update failure code triggered when no reachable destinations remain (e.g., all patrol
      waypoints are blocked).
    value: '0x06'
    value_type: integer
    member_of:
    - CharacterPathUpdateType
    status: active
  PU_FAILURE_OTHER:
    name: PU_FAILURE_OTHER
    type: constant
    description: Path update failure code representing an unspecified or general failure.
    value: 1000000
    value_type: integer
    member_of:
    - CharacterPathUpdateType
    status: active
  PU_FAILURE_PARCEL_UNREACHABLE:
    name: PU_FAILURE_PARCEL_UNREACHABLE
    type: constant
    description: Path update failure code triggered when a character is blocked from entering a parcel
      (e.g., the parcel is full or object entry was disabled after the navmesh was baked).
    value: 11
    value_type: integer
    member_of:
    - CharacterPathUpdateType
    status: active
  PU_FAILURE_TARGET_GONE:
    name: PU_FAILURE_TARGET_GONE
    type: constant
    description: Path update failure code triggered when an llPursue or llEvade target can no longer be
      tracked (e.g., they left the region or went more than ~30m outside region boundaries).
    value: '0x05'
    value_type: integer
    member_of:
    - CharacterPathUpdateType
    status: active
  PU_FAILURE_UNREACHABLE:
    name: PU_FAILURE_UNREACHABLE
    type: constant
    description: Path update failure code triggered when a previously valid goal becomes unreachable (e.g.,
      an obstacle blocks the path).
    value: '0x04'
    value_type: integer
    member_of:
    - CharacterPathUpdateType
    status: active
  PU_GOAL_REACHED:
    name: PU_GOAL_REACHED
    type: constant
    description: Path update status code triggered when the character reaches its goal and either stops
      or chooses a new goal (if wandering).
    value: '0x01'
    value_type: integer
    member_of:
    - CharacterPathUpdateType
    status: active
  PU_SLOWDOWN_DISTANCE_REACHED:
    name: PU_SLOWDOWN_DISTANCE_REACHED
    type: constant
    description: Path update status code triggered when the character enters the slowdown distance near
      its current goal.
    value: '0x00'
    value_type: integer
    member_of:
    - CharacterPathUpdateType
    status: active
  RAD_TO_DEG:
    name: RAD_TO_DEG
    type: constant
    description: 180/PI. Multiply a value in radians by this number to convert it to degrees.
    value: '57.2957795'
    value_type: float
    member_of: null
