    name: llWind
    type: function
    description: Returns a vector representing the wind velocity at the prim's position offset by the
      vector offset.
    return: vector
    energy: 10.0
    sleep: 0.0
    function-id: 44
    params:
    - name: offset
      type: vector
      description: Offset relative to the prim's position, expressed in local coordinates.
    categories:
    - region
    deprecated: false
    status: active
    related:
